---
# OpenSSF Scorecard: checks this repository's supply-chain practices and publishes the result,
# which the badge in the README shows. The official example workflow (ossf/scorecard-action
# v2.5.0, examples/scorecard.yml), with a manual trigger added.

name: 'Scorecard supply-chain security'

'on':
  # For the Branch-Protection check. Only the default branch is supported.
  branch_protection_rule:
  # Keeps the Maintained check updated.
  schedule:
    - cron: '15 14 * * 0'
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}
# Blocks all cache access.
cache-mode: none

jobs:
  analysis:
    name: 'Scorecard analysis'
    runs-on: ubuntu-latest
    # Scorecard only supports the default branch.
    if: ${{ github.event.repository.default_branch == github.ref_name }}
    permissions:
      security-events: write # Upload SARIF to GitHub code scanning.
      id-token: write # Sign results published to api.scorecard.dev.

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Run analysis'
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: 'Upload artifact'
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: 'Upload to code scanning'
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
