description:
  human:
    en_US: 'Every buying signal seen across all companies from a day on, oldest first, a page at a time: the day, the company, where it was seen (its website, domain records, job ads, filings or announcements), what kind of signa...'
  llm: 'Every buying signal seen across all companies from a day on, oldest first, a page at a time: the day, the company, where it was seen (its website, domain records, job ads, filings or announcements), what kind of signal it is and the buying topics it points to. Narrow it to one buying topic, one kind of source or a technology the signal names, and by the company behind it: its industry, business model, country, website traffic, head count, listing, health and intent score. Use it to watch a topic for new interest as it appears, or to build a list from fresh signals. Paid from the Fokals prepaid balance at the prices on https://api.fokals.com/v1/prices. A call that costs more than the account lets run unasked returns its price instead: tell the person, then call again with max_usd once they agree.'
