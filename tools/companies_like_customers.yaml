description:
  human:
    en_US: Finds the companies that look today the way the person's own customers looked when they bought.
  llm: 'Finds the companies that look today the way the person''s own customers looked when they bought. Give up to 20 customers, by website, name or id, each with the day it bought where known, and the technology they bought where there is one. The answer also says for which customers a buying moment was found, and what most of them did before buying. Results are strongest when the customers'' buying dates are known or a technology is given; without either, companies are matched on how alike they are to the customers today. The customers, and companies already running the technology, are left out. At most 100 companies a call. Paid from the Fokals prepaid balance at the prices on https://api.fokals.com/v1/prices. A call that costs more than the account lets run unasked returns its price instead: tell the person, then call again with max_usd once they agree.'
