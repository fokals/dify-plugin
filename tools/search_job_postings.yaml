# Written by scripts/generate.py from the Fokals OpenAPI document.
identity:
  name: search_job_postings
  author: fokals
  label:
    en_US: Search job postings
description:
  human:
    en_US: 'Searches the open job postings of companies: by words in the title, function, seniority, country, remote or on site, a technology the posting asks for, pay, whether it states pay or a project, how lately the posting a...'
  llm: 'Searches the open job postings of companies: by words in the title, function, seniority, country, remote or on site, a technology the posting asks for, pay, whether it states pay or a project, how lately the posting appeared, and the hiring company''s industry, website traffic, listing and health. The latest postings come first, each with its company, function, seniority, pay where stated, and link. Use it to find who is hiring for a role, to spot a team being built, or to check hiring at a list of accounts. Give at least one filter. Paid from the Fokals prepaid balance at the prices on https://api.fokals.com/v1/prices. A call that costs more than the account lets run unasked returns its price instead: tell the person, then call again with max_usd once they agree.'
