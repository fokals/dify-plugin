  - value: ai_build
    label:
      en_US: ai_build
  human_description:
    en_US: 'Only postings that state a project of this kind: migration (a move from one system to another), first_team (the first team of a function), compliance (work towards a certification), expansion (into a new country or region, not the company''s own), ai_build (building an AI product).'
  llm_description: 'Only postings that state a project of this kind: migration (a move from one system to another), first_team (the first team of a function), compliance (work towards a certification), expansion (into a new country or region, not the company''s own), ai_build (building an AI product).'
