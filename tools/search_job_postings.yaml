  human_description:
    en_US: 'The company''s health in the latest week: distress (signs of distress), watch (worth watching), growing or breakout (breaking out).'
  llm_description: 'The company''s health in the latest week: distress (signs of distress), watch (worth watching), growing or breakout (breaking out).'
