  required: false
  form: llm
  label:
    en_US: Industry
  type: string
  human_description:
    en_US: 'The hiring company''s industry. One of: fashion_apparel, beauty_personal_care, health_wellness, food_beverage, home_garden, consumer_electronics, software_saas, finance_insurance, education, travel_hospitality, automotive, real_estate, entertainment_media, gaming, sports_outdoors, retail_marketplace, professional_services, telecom_utilities, nonprofit_public, pets, other.'
  llm_description: 'The hiring company''s industry. One of: fashion_apparel, beauty_personal_care, health_wellness, food_beverage, home_garden, consumer_electronics, software_saas, finance_insurance, education, travel_hospitality, automotive, real_estate, entertainment_media, gaming, sports_outdoors, retail_marketplace, professional_services, telecom_utilities, nonprofit_public, pets, other.'
- name: seen_since
  required: false
  form: llm
  label:
    en_US: Seen since
  type: string
  human_description:
    en_US: Only postings first seen on or after this date, YYYY-MM-DD.
  llm_description: Only postings first seen on or after this date, YYYY-MM-DD.
- name: min_salary_usd
  required: false
  form: llm
  label:
    en_US: Min salary usd
  type: number
  min: 1
  max: 10000000
  human_description:
    en_US: Only postings that state pay of at least this much a year, in US dollars.
  llm_description: Only postings that state pay of at least this much a year, in US dollars.
- name: pay_stated
  required: false
  form: llm
  label:
