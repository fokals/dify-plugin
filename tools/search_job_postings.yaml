  required: false
  form: llm
  label:
    en_US: Seniority
  type: string
  human_description:
    en_US: 'One of: intern, entry, mid, senior, lead_principal, manager, director, vp, c_level.'
  llm_description: 'One of: intern, entry, mid, senior, lead_principal, manager, director, vp, c_level.'
- name: country
  required: false
  form: llm
  label:
    en_US: Country
  type: string
