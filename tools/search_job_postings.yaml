  human_description:
    en_US: 'The company''s website is among the most visited websites in the world in the latest month held, as a string. One of: 10000 (Top 10,000 websites), 100000 (Top 100,000 websites), 1000000 (Top 1 million websites), 10000000 (Top 10 million websites).'
  llm_description: 'The company''s website is among the most visited websites in the world in the latest month held, as a string. One of: 10000 (Top 10,000 websites), 100000 (Top 100,000 websites), 1000000 (Top 1 million websites), 10000000 (Top 10 million websites).'
- name: listed
  required: false
  form: llm
  label:
    en_US: Listed
  type: boolean
  human_description:
